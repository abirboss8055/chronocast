name: ChronoCast Publisher

on:
  schedule:
    # Checks the queue every 15 minutes
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  publish-queue:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run ChronoCast Publisher
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CUSTOM_WEBHOOK_URL: ${{ secrets.CUSTOM_WEBHOOK_URL }}
        run: node publisher.js

      - name: Commit Queue & History Updates
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Action"
          git add queue.json published.json
          git commit -m "ChronoCast: update queue and published history" || echo "No changes to commit"
          git push